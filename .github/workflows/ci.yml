name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit and integration tests
        run: npm test
        env:
          COOKIE_SECRET: test-secret-key-for-ci-only
          PLATFORM_XEC_ADDRESS: ecash:qp54xhk40f3fewpkp80pa9v28jr6940fmv38nxlahf
          NEXT_PUBLIC_PLATFORM_XEC_ADDRESS: ecash:qp54xhk40f3fewpkp80pa9v28jr6940fmv38nxlahf

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
        if: always()

  e2e:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build app
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_PLATFORM_XEC_ADDRESS: ${{ secrets.NEXT_PUBLIC_PLATFORM_XEC_ADDRESS }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          PLATFORM_XEC_ADDRESS: ${{ secrets.NEXT_PUBLIC_PLATFORM_XEC_ADDRESS }}

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_PLATFORM_XEC_ADDRESS: ${{ secrets.NEXT_PUBLIC_PLATFORM_XEC_ADDRESS }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          PLATFORM_XEC_ADDRESS: ${{ secrets.NEXT_PUBLIC_PLATFORM_XEC_ADDRESS }}

      - name: Upload E2E report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
        if: always()
